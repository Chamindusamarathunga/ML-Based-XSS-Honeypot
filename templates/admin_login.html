<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Console - TechBlog</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #f8fafc; }
        .login-card { background: #1e293b; padding: 2.5rem; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 100%; max-width: 420px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #38bdf8; text-align: center; margin-bottom: 2rem; }
        h2 { font-size: 1.25rem; font-weight: 600; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #94a3b8; }
        input { width: 100%; padding: 0.75rem; background: #334155; border: 1px solid #475569; border-radius: 8px; color: white; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #38bdf8; }
        .submit-btn { width: 100%; padding: 0.75rem; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
        .submit-btn:hover { background: #0369a1; }
        .footer-note { text-align: center; font-size: 0.75rem; color: #64748b; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">TechBlog Admin</div>
        <h2>Restricted Access</h2>
        <form action="/admin/login" method="POST">
            <div class="form-group">
                <label for="username">Administrator ID</label>
                <input type="text" id="username" name="username" placeholder="Enter ID" required>
            </div>
            <div class="form-group">
                <label for="password">Security Token</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Authorize Access</button>
        </form>
        <p class="footer-note">Unprivileged access attempt will be logged.</p>
    </div>
</body>
</html>
